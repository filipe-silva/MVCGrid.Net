name: Publish NuGet packages

# Packs the four libraries (MVCGrid, MVCGrid.MvcWeb, MVCGrid.AspNetCore, MVCGrid.Wasm) 
# and pushes .nupkg + .snupkg to nuget.org using Trusted Publishing (OIDC) — no long-lived API key is stored. 
# The NuGet/login action exchanges a short-lived GitHub OIDC token for a temporary (1-hour) nuget.org API key just before push.
#
# The package version is always the <Version> in Directory.Build.props — bump it there before releasing.
# Trigger by publishing a GitHub Release (the tag is just a marker; 
# it does not set the version) or run it manually (workflow_dispatch; tick dry_run to pack only).
#
# One-time setup:
#   1. On nuget.org: Account -> Trusted Publishing -> add a policy for this repo
#   2. Add the repo secret NUGET_USER = your nuget.org username (profile name, NOT email).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Pack only, do not push to nuget.org'
        type: boolean
        default: false

jobs:
  publish:
    # net48 (MVCGrid.MvcWeb) needs the .NET Framework targeting pack, so build on Windows.
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write   # required for Trusted Publishing (GitHub OIDC token issuance)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Pack
        shell: bash
        run: |
          set -e
          for proj in \
            src/MVCGrid.Core/MVCGrid.Core.csproj \
            src/MVCGrid.MvcWeb/MVCGrid.MvcWeb.csproj \
            src/MVCGrid.AspNetCore/MVCGrid.AspNetCore.csproj \
            src/MVCGrid.Wasm/MVCGrid.Wasm.csproj; do
            echo "::group::pack $proj"
            dotnet pack "$proj" -c Release -o artifacts --nologo
            echo "::endgroup::"
          done

      - name: Upload packages as build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg

      # --- Push path (skipped on a manual dry run) ---

      - name: NuGet login (OIDC -> temporary API key)
        if: github.event_name == 'release' || !inputs.dry_run
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        if: github.event_name == 'release' || !inputs.dry_run
        shell: bash
        run: |
          # Pushes each .nupkg; the matching .snupkg is uploaded automatically.
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
