<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MVCGrid.Net</title>
    <link rel="icon" href="data:," />
    <!-- No <base>: all assets are referenced relatively so this works under /MVCGrid.Net/. -->
    <!-- Same look as the classic MVC example (_Layout.cshtml + Site.css): Bootstrap 3 + SyntaxHighlighter.
         All client-side libraries are restored by LibMan (libman.json) into wwwroot/lib at build time,
         so the published site is fully self-contained (no CDN). -->
    <link rel="stylesheet" href="lib/bootstrap/css/bootstrap.min.css" />
    <link rel="stylesheet" href="lib/syntaxhighlighter/styles/shCore.css" />
    <link rel="stylesheet" href="lib/syntaxhighlighter/styles/shThemeDefault.css" />
    <style type="text/css">
        /* Site.css (classic MVC example) */
        body {
            padding-top: 50px;
            padding-bottom: 20px;
        }

        .body-content {
            padding-left: 15px;
            padding-right: 15px;
        }

        .dl-horizontal dt {
            white-space: normal;
        }

        input,
        select,
        textarea {
            max-width: 280px;
        }

        /* _Layout.cshtml inline styles */
        .nuget-badge code {
            -moz-border-radius: 5px;
            -webkit-border-radius: 5px;
            background-color: #202020;
            border: 4px solid silver;
            border-radius: 5px;
            box-shadow: 2px 2px 3px #6e6e6e;
            color: #e2e2e2;
            display: block;
            font: 1.5em 'andale mono','lucida console',monospace;
            line-height: 1.5em;
            overflow: auto;
            padding: 15px;
        }

        /* Home/Index.cshtml head section (column-visibility dropdown) */
        .dropdown-menu input { margin-top: -4px; }
        .dropdown-menu label { margin: 0; }

        /* CustomStyle demo (custom rendering engine markup) */
        .customStyleTable { width: 100%; border-collapse: collapse; }
        .customStyleTable th, .customStyleTable td { border: 1px solid #ddd; padding: 6px 10px; }
        .customStyleTable thead th { background: #337ab7; color: #fff; cursor: pointer; }

        .boot-note { color: #999; }
    </style>
</head>
<body>
    <div class="navbar navbar-inverse navbar-fixed-top">
        <div class="container">
            <div class="navbar-header">
                <button type="button" class="navbar-toggle" data-toggle="collapse" data-target=".navbar-collapse">
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                </button>
                <a class="navbar-brand" href="#/">MVCGrid.Net</a>
            </div>
            <div class="navbar-collapse collapse">
                <ul class="nav navbar-nav" id="topnav">
                    <li data-nav="home"><a href="#/">Home</a></li>
                    <li data-nav="gettingstarted"><a href="#/gettingstarted">Getting Started</a></li>
                    <li data-nav="demos"><a href="#/demos">Demos</a></li>
                    <li data-nav="documentation"><a href="#/documentation">Documentation</a></li>
                    <li data-nav="download"><a href="#/download">Download</a></li>
                    <li data-nav="support"><a href="#/support">Support</a></li>
                </ul>
            </div>
        </div>
    </div>
    <div class="container body-content">
        <div id="content">
            <p class="boot-note">Loading the .NET WebAssembly runtime (one-time, then cached)&hellip;</p>
        </div>
        <hr />
        <footer>
            <p class="text-muted">Everything on this site runs entirely in your browser via .NET WebAssembly &mdash; no server.</p>
        </footer>
    </div>

    <script src="lib/jquery/jquery.min.js"></script>
    <script src="lib/bootstrap/js/bootstrap.min.js"></script>
    <script src="lib/syntaxhighlighter/scripts/shCore.js"></script>
    <script src="lib/syntaxhighlighter/scripts/shBrushJScript.js"></script>
    <script src="lib/syntaxhighlighter/scripts/shBrushCSharp.js"></script>
    <script type="module" src="main.js"></script>
</body>
</html>
